name: Desktop build (electron-builder)
description: Run electron-builder after PyInstaller + Vite build. Caller must set up toolchain and freeze backend first.

inputs:
  platform:
    description: Target OS (win, mac, linux)
    required: true
  arch:
    description: CPU arch for win/mac (x64 or arm64); ignored for linux
    required: false
    default: x64
  notarize:
    description: macOS notarization when secrets are configured (release only)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Build macOS installer
      if: inputs.platform == 'mac'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        NOTARYTOOL_TIMEOUT: '1200'
      run: |
        set -euo pipefail
        ARCH="${{ inputs.arch }}"
        # package.json lists arm64+x64 targets; without this override electron-builder
        # builds both arches in one job and hdiutil DMG detach fails on the runner.
        MAC_TARGETS="[{\"target\":\"dmg\",\"arch\":[\"${ARCH}\"]},{\"target\":\"zip\",\"arch\":[\"${ARCH}\"]}]"
        NOTARIZE_FLAG="--config.mac.notarize=false"
        if [ "${{ inputs.notarize }}" = "true" ]; then
          NOTARIZE_FLAG="--config.mac.notarize=true"
        fi
        npx electron-builder --mac --"${ARCH}" --publish never \
          ${NOTARIZE_FLAG} \
          --config.mac.target="${MAC_TARGETS}"

    - name: Build Windows installer
      if: inputs.platform == 'win'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: npx electron-builder --win --${{ inputs.arch }} --publish never

    - name: Build Linux installer
      if: inputs.platform == 'linux'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: npx electron-builder --linux --publish never

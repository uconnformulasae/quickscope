name: Install Python backend (PyInstaller)
description: pip install backend requirements; win-arm64 builds pyarrow against vcpkg Arrow C++.

inputs:
  win-arm64:
    description: Set true on windows-11-arm desktop jobs (no pyarrow win_arm64 wheels on PyPI)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install Arrow C++ via vcpkg (win-arm64)
      if: inputs.win-arm64 == 'true'
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 37e0e23462faa0af8d02023efa095165e171a457
        runVcpkgInstall: true
        vcpkgJsonGlob: backend/vcpkg-win-arm64/vcpkg.json
        appendedCacheKey: win-arm64-arrow

    - name: pip install (default platforms)
      if: inputs.win-arm64 != 'true'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt pyinstaller

    - name: pip install (win-arm64 — build pyarrow from source)
      if: inputs.win-arm64 == 'true'
      shell: pwsh
      env:
        ARROW_HOME: ${{ github.workspace }}/vcpkg/installed/arm64-windows
        CMAKE_PREFIX_PATH: ${{ github.workspace }}/vcpkg/installed/arm64-windows
        PYARROW_WITH_PARQUET: 'ON'
        PYARROW_WITH_DATASET: 'OFF'
      run: |
        python -m pip install --upgrade pip wheel setuptools cmake ninja cython numpy
        $req = Get-Content backend/requirements.txt | Where-Object { $_ -notmatch '^\s*pyarrow' }
        $reqFile = Join-Path $env:RUNNER_TEMP 'requirements-no-pyarrow.txt'
        $req | Set-Content -Path $reqFile -Encoding utf8
        pip install -r $reqFile pyinstaller
        pip install "pyarrow>=14.0.0" --no-binary=pyarrow

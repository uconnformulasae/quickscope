name: libxrk Regression

# libxrk fallback parser regression — runs inside the Linux backend Docker image.
# Independent of dll-regression.yml and test.yml.

on:
  push:
    branches: [main, Dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libxrk-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libxrk-regression:
    name: libxrk-regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download fixtures
        uses: ./.github/actions/setup-parser-assets
        with:
          download-fixtures: 'true'
          download-dll: 'false'

      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t quickscope-ci-backend .

      - name: Pytest (libxrk integration in Docker)
        env:
          QUICKSCOPE_PARSER: libxrk
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace:ro" \
            -w /workspace \
            -e QUICKSCOPE_PARSER=libxrk \
            quickscope-ci-backend \
            bash -c "pip install -q -r backend/requirements-dev.txt && python -m pytest -m libxrk -q"

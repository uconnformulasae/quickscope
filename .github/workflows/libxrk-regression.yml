name: libxrk Regression

# libxrk fallback parser regression — no DLL, no Race Studio CSV.
# Independent of dll-regression.yml and test.yml.

on:
  push:
    branches: [main, Dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libxrk-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libxrk-regression:
    name: libxrk-regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download fixtures
        uses: ./.github/actions/setup-parser-assets
        with:
          download-fixtures: 'true'
          download-dll: 'false'

      - name: Install Python test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Pytest (libxrk integration)
        env:
          QUICKSCOPE_PARSER: libxrk
        run: python -m pytest -m libxrk -q

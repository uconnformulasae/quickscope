name: CI

on:
  push:
    branches: [main, Dev]
  pull_request:
  workflow_dispatch:
    inputs:
      skip_desktop:
        description: Skip desktop build matrix
        type: boolean
        default: false
      skip_docker:
        description: Skip docker compose job
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu
            runs-on: ubuntu-latest
            pytest: 'python -m pytest -m "not dll" -q'
          - id: windows
            runs-on: windows-latest
            pytest: python -m pytest -m dll -q

    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parser assets and DLL (Windows)
        if: matrix.id == 'windows'
        uses: ./.github/actions/setup-parser-assets
        with:
          download-fixtures: 'true'

      - name: Install Python test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Pytest
        run: ${{ matrix.pytest }}

      - name: Validator log (Windows, on failure)
        if: failure() && matrix.id == 'windows'
        run: python scripts/validate_dll.py tests/fixtures -v

      - name: Set up Node 20
        if: matrix.id == 'ubuntu'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node deps
        if: matrix.id == 'ubuntu'
        run: npm ci

      - name: TypeScript check
        if: matrix.id == 'ubuntu'
        run: npm run check

      - name: Frontend unit tests
        if: matrix.id == 'ubuntu'
        run: npm run test:client

  docker:
    name: docker
    if: github.event_name != 'workflow_dispatch' || inputs.skip_docker != true
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Backend healthcheck
        run: |
          docker compose up -d backend
          for i in $(seq 1 30); do
            if docker compose exec -T backend python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')"; then
              echo "Backend healthy"
              docker compose down
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          docker compose down
          exit 1

  desktop:
    name: desktop / ${{ matrix.label }}
    if: github.event_name != 'workflow_dispatch' || inputs.skip_desktop != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: win-x64
            runs-on: windows-latest
            platform: win
            arch: x64
          - label: mac-arm64
            runs-on: macos-latest
            platform: mac
            arch: arm64
          - label: mac-x64
            runs-on: macos-latest
            platform: mac
            arch: x64
          - label: linux-x64
            runs-on: ubuntu-latest
            platform: linux
            arch: x64

    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils \
            libatspi2.0-0 libdrm2 libgbm1 libasound2t64

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Python build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Freeze Python backend
        working-directory: backend
        run: pyinstaller quickscope-backend.spec --noconfirm

      - name: Install Node deps
        run: npm ci

      - name: Build frontend (Vite)
        run: npm run build

      - name: Build desktop installer
        uses: ./.github/actions/desktop-build
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          notarize: 'false'

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quickscope-${{ matrix.label }}-${{ github.run_id }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
          retention-days: 7

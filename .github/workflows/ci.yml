name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_docker:
        description: Skip docker compose job
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu
            runs-on: ubuntu-latest
            pytest: 'python -m pytest -m "not dll" -q'
          - id: windows
            runs-on: windows-latest
            pytest: python -m pytest -m dll -q

    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parser assets and DLL (Windows)
        if: matrix.id == 'windows'
        uses: ./.github/actions/setup-parser-assets
        with:
          download-fixtures: 'true'

      - name: Install Python test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      # AiM protocol replay tests (tests/test_aim_live.py, tests/test_aim_download.py)
      # need real device traffic. Extracted TCP streams live on the aim-streams-v1
      # release (scripts/extract_aim_streams.py, docs/CI.md); without it those
      # tests skip instead of failing.
      - name: AiM capture streams
        if: matrix.id == 'ubuntu'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p tests/fixtures/aim_streams
          if gh release download aim-streams-v1 --repo "$REPO" \
               --pattern '*.bin.gz' --dir tests/fixtures/aim_streams --skip-existing; then
            echo "Downloaded $(ls tests/fixtures/aim_streams/*.bin.gz | wc -l) AiM stream file(s)."
          else
            echo "::notice::aim-streams-v1 release not found; AiM capture replay tests will skip."
          fi

      - name: Pytest
        run: ${{ matrix.pytest }}

      - name: Validator log (Windows, on failure)
        if: failure() && matrix.id == 'windows'
        run: python scripts/validate_dll.py tests/fixtures -v

      - name: Set up Node 20
        if: matrix.id == 'ubuntu'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node deps
        if: matrix.id == 'ubuntu'
        run: npm ci

      - name: npm audit
        if: matrix.id == 'ubuntu'
        run: npm audit --audit-level=moderate

      - name: TypeScript check
        if: matrix.id == 'ubuntu'
        run: npm run check

      - name: Frontend unit tests
        if: matrix.id == 'ubuntu'
        run: npm run test:client

  docker:
    name: docker
    if: github.event_name != 'workflow_dispatch' || inputs.skip_docker != true
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Backend healthcheck
        run: |
          mkdir -p backend/data && chmod 777 backend/data
          docker compose up -d backend
          for i in $(seq 1 30); do
            if docker compose exec -T backend python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')"; then
              echo "Backend healthy"
              docker compose down
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          docker compose down
          exit 1

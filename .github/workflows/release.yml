name: Release

# Builds QuickScope installers for macOS (arm64 + x64) and Windows (x64) and
# attaches them to a GitHub Release.
#
# Triggers:
#   - Push a git tag matching v*.*.*  (e.g. v1.0.1)  → publishes a Release
#   - Manual run from the Actions tab                → builds artifacts only
#
# macOS notarization is opt-in: it only runs when ALL of these secrets are
# present — APPLE_API_KEY_CONTENT, APPLE_API_KEY_ID, APPLE_API_KEY_ISSUER,
# APPLE_TEAM_ID, MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD. If any is missing,
# the macOS build still produces an unsigned .dmg/.zip; users will see a
# Gatekeeper warning but the binaries are usable. This avoids the 5-hour
# hang we hit on v1.0.0 when notarytool waited indefinitely for missing
# credentials.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon runner
            arch: arm64
            label: mac-arm64
          - os: macos-13        # Intel runner
            arch: x64
            label: mac-x64
          - os: windows-latest
            arch: x64
            label: win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Python build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Freeze Python backend
        working-directory: backend
        run: pyinstaller quickscope-backend.spec --noconfirm

      - name: Install Node deps
        run: npm ci

      - name: Build frontend (Vite)
        run: npm run build

      # ─── macOS: detect whether we can notarize ────────────────────────────
      #
      # All six secrets must be present. We export NOTARIZE=1 so the build
      # step can pass --config.mac.notarize=true to electron-builder. If any
      # secret is missing the value stays unset and we build unsigned.
      - name: Probe macOS signing/notarize secrets
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_KEY_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -n "$APPLE_API_KEY_CONTENT" ] \
             && [ -n "$APPLE_API_KEY_ID" ] \
             && [ -n "$APPLE_API_ISSUER" ] \
             && [ -n "$APPLE_TEAM_ID" ] \
             && [ -n "$MAC_CERT_P12_BASE64" ] \
             && [ -n "$MAC_CERT_PASSWORD" ]; then
            echo "All Apple signing/notarize secrets present → will sign + notarize"
            mkdir -p ~/.private_keys
            echo "$APPLE_API_KEY_CONTENT" > ~/.private_keys/AuthKey.p8
            echo "APPLE_API_KEY=$HOME/.private_keys/AuthKey.p8" >> $GITHUB_ENV
            echo "QS_NOTARIZE=1" >> $GITHUB_ENV
          else
            echo "One or more Apple secrets missing → producing UNSIGNED build (no notarize)"
            echo "QS_NOTARIZE=0" >> $GITHUB_ENV
          fi

      - name: Build macOS installer
        if: runner.os == 'macOS'
        timeout-minutes: 25
        env:
          # Signing is automatic when CSC_LINK + CSC_KEY_PASSWORD are present.
          # Notarization is opt-in via QS_NOTARIZE (set above) which becomes
          # the --config.mac.notarize=... arg below. We also cap notarytool's
          # own wait (it can poll Apple for tens of minutes); 1200s = 20min
          # is plenty for a normal submission.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_KEY_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTARYTOOL_TIMEOUT: '1200'
        run: |
          if [ "${QS_NOTARIZE:-0}" = "1" ]; then
            npx electron-builder --mac --${{ matrix.arch }} --publish never \
              --config.mac.notarize=true
          else
            npx electron-builder --mac --${{ matrix.arch }} --publish never \
              --config.mac.notarize=false
          fi

      # ─── Windows: build unsigned ──────────────────────────────────────────
      - name: Build Windows installer
        if: runner.os == 'Windows'
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quickscope-${{ matrix.label }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: warn
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}

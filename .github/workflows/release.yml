name: Release

# Builds QuickScope installers for Windows (x64 + arm64), macOS (arm64 + Intel x64), and Linux (x64 + arm64);
# attaches them to a GitHub Release on version tags.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-latest
            platform: mac
            arch: arm64
            label: mac-arm64
          - runs-on: macos-15-intel
            platform: mac
            arch: x64
            label: mac-x64-intel
          - runs-on: windows-latest
            platform: win
            arch: x64
            label: win-x64
          - runs-on: windows-11-arm
            platform: win
            arch: arm64
            label: win-arm64
          - runs-on: ubuntu-latest
            platform: linux
            arch: x64
            label: linux-x64
          - runs-on: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            label: linux-arm64

    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils \
            libatspi2.0-0 libdrm2 libgbm1 libasound2t64

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Python build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Freeze Python backend
        working-directory: backend
        run: pyinstaller quickscope-backend.spec --noconfirm

      - name: Install Node deps
        run: npm ci

      - name: Build frontend (Vite)
        run: npm run build

      - name: Probe macOS signing/notarize secrets
        if: matrix.platform == 'mac'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$APPLE_API_KEY_CONTENT" ] \
             && [ -n "$APPLE_API_KEY_ID" ] \
             && [ -n "$APPLE_API_ISSUER" ] \
             && [ -n "$APPLE_TEAM_ID" ] \
             && [ -n "$MAC_CERT_P12_BASE64" ] \
             && [ -n "$MAC_CERT_PASSWORD" ]; then
            echo "All Apple signing/notarize secrets present → will sign + notarize"
            mkdir -p ~/.private_keys
            echo "$APPLE_API_KEY_CONTENT" > ~/.private_keys/AuthKey.p8
            echo "APPLE_API_KEY=$HOME/.private_keys/AuthKey.p8" >> $GITHUB_ENV
            echo "QS_NOTARIZE=1" >> $GITHUB_ENV
          else
            echo "One or more Apple secrets missing → producing UNSIGNED build (no notarize)"
            echo "QS_NOTARIZE=0" >> $GITHUB_ENV
          fi

      - name: Build desktop installer (notarized macOS)
        if: matrix.platform == 'mac' && env.QS_NOTARIZE == '1'
        uses: ./.github/actions/desktop-build
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          platform: mac
          arch: ${{ matrix.arch }}
          notarize: 'true'

      - name: Build desktop installer
        if: matrix.platform != 'mac' || env.QS_NOTARIZE != '1'
        uses: ./.github/actions/desktop-build
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          notarize: 'false'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quickscope-${{ matrix.label }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: warn
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}

name: Test

# Fast app regression — no DLL, no fixtures, no Electron build.
# Independent of dll-regression.yml (separate workflow, separate concurrency).

on:
  push:
    branches: [main, Dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: [self-hosted, Windows, X64, quickscope]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Pytest (unit)
        run: python -m pytest -m "not dll and not libxrk" -q

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node deps
        run: npm ci

      - name: TypeScript check
        run: npm run check

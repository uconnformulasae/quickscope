services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    # Published on this machine only. To reach QuickScope from another device,
    # set QUICKSCOPE_BIND=0.0.0.0 and QUICKSCOPE_ALLOWED_HOSTS=<this machine's IP>.
    ports:
      - "${QUICKSCOPE_BIND:-127.0.0.1}:8000:8000"
    environment:
      QUICKSCOPE_DATA_DIR: /data
      QUICKSCOPE_ALLOWED_HOSTS: ${QUICKSCOPE_ALLOWED_HOSTS:-}
      QUICKSCOPE_PARSER: libxrk
    volumes:
      - ./backend/data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "${QUICKSCOPE_BIND:-127.0.0.1}:5173:5173"
    environment:
      QUICKSCOPE_ALLOWED_HOSTS: ${QUICKSCOPE_ALLOWED_HOSTS:-}
    depends_on:
      backend:
        condition: service_healthy

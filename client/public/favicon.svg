  <!-- Crosshair lines -->
  <line x1="16" y1="4" x2="16" y2="10" stroke="#4361ee" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="22" x2="16" y2="28" stroke="#4361ee" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="16" x2="10" y2="16" stroke="#4361ee" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="16" x2="28" y2="16" stroke="#4361ee" stroke-width="2" stroke-linecap="round"/>

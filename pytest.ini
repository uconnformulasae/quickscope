[pytest]
testpaths = tests
pythonpath = backend
markers =
    dll: Windows DLL integration (needs MatLabXRK DLL + local .xrk fixture)
    libxrk: libxrk parser integration (needs local .xrk fixture, no DLL)
    e2e: launches the real backend process and drives it over HTTP/WebSocket
    slow: waits on real timeouts (device probes, script time limits); skip with -m 'not slow'
addopts = -ra
